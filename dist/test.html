<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
    <style>
        body { font-family: Arial; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #061a37 0%, #0f4fd4 100%); }
        .box { background: white; padding: 40px; border-radius: 8px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #0f4fd4; margin: 0 0 20px 0; }
        p { color: #666; margin: 10px 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0f4fd4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0a3ba0; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Insurance CRM</h1>
        <p>Test Login (HTML only)</p>
        <input type="email" placeholder="Email" value="test@example.com">
        <input type="password" placeholder="Password" value="test123">
        <button onclick="alert('This is plain HTML - server works!')">Test Login</button>
        <p style="font-size:12px; margin-top:20px; color:#999;">If you see this, the server is working correctly.</p>
    </div>
</body>
</html>
