name: CI/CD Pipeline - InsuraFlow CRM

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '24.15.0'

jobs:
  # ==========================================
  # Build & Test
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then exit 1; fi
          if [ -z "$(find dist -name '*.js')" ]; then exit 1; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  # ==========================================
  # Lighthouse Audit
  # ==========================================
  lighthouse:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'

      - name: Comment on PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            console.log('Lighthouse audit completed');

  # ==========================================
  # Security Audit
  # ==========================================
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'InsuraFlow-CRM'
          path: '.'
          format: 'JSON'
          args: >
            --enableExperimental
            --enableVulnerability

  # ==========================================
  # E2E Tests
  # ==========================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend server
        run: npm run dev:backend &
        env:
          NODE_ENV: test
          PORT: 5000

      - name: Start frontend dev server
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:5000/api

      - name: Wait for servers to start
        run: sleep 5

      - name: Run E2E tests
        run: npm run test
        timeout-minutes: 10

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/

  # ==========================================
  # Deploy to Staging (Manual Approval)
  # ==========================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, security, e2e-tests]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.insuraflow.yourapp.com

    steps:
      - uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging environment"
          # Add your staging deployment commands here
          # Example: aws s3 sync dist/ s3://staging-bucket/

      - name: Run smoke tests
        run: |
          echo "✅ Running smoke tests on staging"
          # Add your smoke test commands here

  # ==========================================
  # Deploy to Production (Requires Manual Approval)
  # ==========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, security, e2e-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://insuraflow.yourapp.com

    steps:
      - uses: actions/checkout@v3

      - name: Verify production checklist
        run: |
          echo "📋 Production Deployment Checklist:"
          echo "☑️ Branch: main"
          echo "☑️ Tests passed"
          echo "☑️ Security audit cleared"
          echo "☑️ Build successful"
          echo "☑️ Database backup: $(date)"

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production"
          # Add your production deployment commands here
          # Example: aws s3 sync dist/ s3://prod-bucket/

      - name: Run production smoke tests
        run: |
          echo "✅ Running smoke tests on production"
          # Add your smoke test commands here

      - name: Monitor error rates
        run: |
          echo "📊 Monitoring error rates..."
          # Add monitoring commands here

      - name: Notify deployment
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployed to production successfully!'
            })
