services:
  - type: web
    name: insurance-crm
    runtime: node
    plan: free
    buildCommand: echo "Using pre-built dist folder"
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true
