services:
  - type: web
    name: insurance-crm
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && echo "Build complete, dist exists: $(test -d dist && echo 'YES' || echo 'NO')"
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true
