services:
  - type: web
    name: insurance-crm
    runtime: node
    plan: free
    buildCommand: set -x && ls -la vite.config.* && rm -rf dist node_modules && npm install && npm run build && echo "✓ Build complete" && ls -la dist/
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true
